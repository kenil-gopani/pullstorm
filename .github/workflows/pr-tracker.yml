import os
import requests
from datetime import datetime

# Environment variables
GITHUB_TOKEN = os.getenv('GTH_TOK')
GITHUB_USERNAME = os.getenv('GH_USERNAME')

def get_merged_prs(username, start_date_str):
    base_url = "https://api.github.com/search/issues"

    headers = {
        "Authorization": f"Bearer {GITHUB_TOKEN}",  # ✅ correct
        "Accept": "application/vnd.github+json",
    }

    query = f"is:pr is:merged author:{username} merged:>{start_date_str}"

    total_prs = 0
    page = 1

    while True:
        params = {"q": query, "per_page": 100, "page": page}
        response = requests.get(base_url, headers=headers, params=params)

        print("DEBUG STATUS:", response.status_code)

        if response.status_code != 200:
            print("ERROR RESPONSE:", response.text)

        response.raise_for_status()

        data = response.json()
        items = data.get('items', [])

        if not items:
            break

        total_prs += len(items)

        if len(items) < 100:
            break

        page += 1

    return total_prs


if __name__ == "__main__":
    today = datetime.utcnow()  # ✅ better for GitHub Actions (UTC)

    start_of_day = datetime(today.year, today.month, today.day)
    start_of_month = datetime(today.year, today.month, 1)
    start_of_year = datetime(today.year, 1, 1)

    prs_today = get_merged_prs(GITHUB_USERNAME, start_of_day.isoformat())
    prs_month = get_merged_prs(GITHUB_USERNAME, start_of_month.isoformat())
    prs_year = get_merged_prs(GITHUB_USERNAME, start_of_year.isoformat())

    print(f"Daily Merged PRs: {prs_today}")
    print(f"Monthly Merged PRs: {prs_month}")
    print(f"Yearly Merged PRs: {prs_year}")

    with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
        print(f'prs_today={prs_today}', file=fh)
        print(f'prs_month={prs_month}', file=fh)
        print(f'prs_year={prs_year}', file=fh)
