import os
import requests

GITHUB_TOKEN = os.environ.get("GTH_TOK")   # <-- IMPORTANT (matches YAML)
GITHUB_USERNAME = os.environ.get("GH_USERNAME")

def get_merged_prs(username, date_filter):
    url = f"https://api.github.com/search/issues?q=is:pr+is:merged+author:{username}+merged:>{date_filter}&per_page=100&page=1"

    headers = {
        "Authorization": f"Bearer {GITHUB_TOKEN}",   # ✅ REQUIRED
        "Accept": "application/vnd.github+json"
    }

    response = requests.get(url, headers=headers)

    print("DEBUG STATUS:", response.status_code)
    print("DEBUG RESPONSE:", response.text)

    response.raise_for_status()

    data = response.json()
    return data.get("total_count", 0)
